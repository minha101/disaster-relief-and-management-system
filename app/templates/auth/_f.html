{% macro wf(f, type=None) %}<div class="mb-3"><label class="form-label small fw-semibold">{{ f.label.text }}</label>
{{ f(class='form-control' + (' is-invalid' if f.errors else ''), type=type) if type else f(class='form-control' + (' is-invalid' if f.errors else '')) }}
{% for e in f.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}</div>{% endmacro %}
